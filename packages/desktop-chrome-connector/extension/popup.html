<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Nolo Browser Connector</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        padding: 16px;
        width: 288px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #111827;
        background: #ffffff;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 600;
      }
      .state {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 10px 0 8px;
        font-weight: 600;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #9ca3af;
        flex: 0 0 auto;
      }
      .dot.ok {
        background: #16a34a;
      }
      .dot.off {
        background: #dc2626;
      }
      p {
        margin: 0 0 10px;
        color: #4b5563;
      }
      dl {
        margin: 0 0 10px;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        color: #4b5563;
      }
      dt {
        color: #6b7280;
      }
      dd {
        margin: 0;
        text-align: right;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
      footer {
        border-top: 1px solid #e5e7eb;
        padding-top: 8px;
        color: #6b7280;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <!-- All text comes from _locales via popup.js, so the popup follows the browser language. -->
    <h1 id="title"></h1>
    <div class="state"><span class="dot" id="dot"></span><span id="state"></span></div>
    <p id="hint"></p>
    <dl>
      <dt id="label-desktop-app"></dt>
      <dd id="host">—</dd>
      <dt id="label-protocol"></dt>
      <dd id="protocol">—</dd>
      <dt id="label-extension"></dt>
      <dd id="version">—</dd>
    </dl>
    <footer id="privacy"></footer>
    <script src="popup.js"></script>
  </body>
</html>

name: CI

on:
  push:
    branches: [main, alpha]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Projection safety gate
        run: bun scripts/public-audit/verifyProjection.ts
      - name: Build web bundle
        # 必须显式声明 desktop edition：esbuild 默认 webEdition = "cloud"，而下一步
        # 要求 latest-assets.json 的 edition === "desktop"。缺这个 env 会让公开仓
        # 每次 push/PR 必然红，且这条 fail-closed 闸门从未有过绿色运行
        # （2026-09-14 独立复审在渲染产物上复现）。
        env:
          NOLO_WEB_EDITION: desktop
          # 必须 production：esBuild 的 timestamp 在非生产下是 "dev"，会走
          # 「发布 dev 构建信号」分支而**不写 public/latest-assets.json**，
          # 于是下一步的 gate 读到缺 edition 的陈旧文件恒失败
          #（2026-09-14 公开仓 CI 实测：edition=missing）。
          NODE_ENV: production
        run: bun scripts/dev/esBuild.js
      - name: Verify desktop edition web bundle (fail closed)
        run: bun scripts/public-audit/desktop/verifyDesktopPackageCapability.ts web --web-root public --identity-root packages/identity

name: CI

on:
  push:
    branches: [main, alpha]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Projection safety gate
        run: bun scripts/public-audit/verifyProjection.ts
      - name: Build web bundle
        run: bun scripts/dev/esBuild.js

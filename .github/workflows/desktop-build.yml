name: Desktop Build

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Build targets (repair/rebuild scope)"
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
      mode:
        # build-only 存在的理由：验证「构建 + 证据」时不应产生任何渠道副作用，
        # 也不应要求 release intent——否则像 2026-09-14 那样，一次只改
        # scripts/release（不触碰 packages/desktop，故不 bump 版本、投影 intent=none）
        # 的修复就完全无法在 CI 上验证。
        description: "release = 构建并发布到 R2/渠道；build-only = 只构建并校验证据，绝不触碰渠道"
        required: false
        default: release
        type: choice
        options:
          - release
          - build-only
      version:
        description: "Target desktop version (must equal projection-release-metadata.json at projection_sha); required only for mode=release"
        required: false
        type: string
      projection_sha:
        description: "Exact public projection commit SHA (40-hex) to build/release from"
        required: true
        type: string

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  select-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      channel: ${{ steps.metadata.outputs.channel }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Validate dispatch binding (fail closed)
        run: |
          set -euo pipefail
          # repair/rebuild 与自动发布同契约：必须显式绑定 40-hex 投影 SHA 与
          # metadata 声明的目标版本；缺失或非法格式直接硬失败，绝不 checkout
          # 默认分支 HEAD。
          if ! printf '%s' "${{ inputs.projection_sha }}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::projection_sha must be an exact 40-hex commit SHA, got '${{ inputs.projection_sha }}'" >&2
            exit 2
          fi
          # 发布模式必须显式绑定目标版本；build-only 不需要（它不校验 intent，
          # 也不会发布任何东西）。
          if [ "${{ inputs.mode }}" != "build-only" ] && [ -z "${{ inputs.version }}" ]; then
            echo "::error::version is required for mode=release" >&2
            exit 2
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.projection_sha }}
          clean: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - id: metadata
        name: Validate projection release metadata (fail closed)
        run: |
          set -euo pipefail
          # channel/version 只来自 projection-release-metadata.json（bun-nolo 生成，
          # channel 由 SemVer 解析）；校验基于 inputs.projection_sha 这一个 commit。
          # 任何缺失、结构损坏、intent 缺失或与 --expect-version 绑定不符都直接
          # 失败：不猜 channel，不重新生成版本。
          # channel/version 与 intent 无关，两种模式都从同一真值源取；差别只在
          # release 模式额外要求 intent=release 且版本与入参绑定。
          # --expect-intent 本身是可选参数，因此 build-only 无需新增任何 CLI 面。
          if [ "${{ inputs.mode }}" = "build-only" ]; then
            bun ./scripts/release/assertProjectionReleaseMetadata.ts \
              --component desktop \
              --set-outputs channel,version,tag
          else
            bun ./scripts/release/assertProjectionReleaseMetadata.ts \
              --component desktop \
              --expect-intent release \
              --expect-version "${{ inputs.version }}" \
              --set-outputs channel,version,tag
          fi
      - name: Immutable release preflight
        id: immutable-release
        # build-only 不会创建 Release，preflight 无意义。
        if: inputs.mode != 'build-only'
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          # gh api 需要显式 token（同模板其他 step 一致）；缺失时 gh 报 exit 4，
          # fail-closed 会把「无法验证 release 存在性」当拒绝理由（2026-09-09
          # 首次真实 dispatch 实测踩中）。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 必须在任何 runner build / R2 publish 副作用之前拒绝已存在的
          # deterministic GitHub Release。非 404 错误（权限、网络等）也必须失败，
          # 不能把未知状态误当成“tag 不存在”。release job 中保留二次检查用于 TOCTOU。
          set +e
          RELEASE_LOOKUP="$(gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>&1)"
          LOOKUP_STATUS=$?
          set -e
          if [ "$LOOKUP_STATUS" -eq 0 ]; then
            echo "::error::release ${RELEASE_TAG} already exists — refusing to build or publish it again" >&2
            exit 1
          fi
          if ! printf '%s\n' "$RELEASE_LOOKUP" | grep -Eq 'HTTP/[0-9.]+ 404|HTTP [0-9.]+ 404'; then
            echo "::error::could not verify whether release ${RELEASE_TAG} exists (gh api exit ${LOOKUP_STATUS})" >&2
            printf '%s\n' "$RELEASE_LOOKUP" >&2
            exit 1
          fi

      - id: targets
        run: |
          # workflow_dispatch-only：targets 直接取 dispatch inputs（无 push 触发路径）。
          TARGETS="${{ inputs.targets }}"
          case "$TARGETS" in
            all) echo 'matrix={"include":[{"os":"windows-latest","label":"windows"},{"os":"macos-latest","label":"macos"},{"os":"ubuntu-latest","label":"linux"}]}' >> "$GITHUB_OUTPUT" ;;
            windows) echo 'matrix={"include":[{"os":"windows-latest","label":"windows"}]}' >> "$GITHUB_OUTPUT" ;;
            macos) echo 'matrix={"include":[{"os":"macos-latest","label":"macos"}]}' >> "$GITHUB_OUTPUT" ;;
            linux) echo 'matrix={"include":[{"os":"ubuntu-latest","label":"linux"}]}' >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: select-targets
    strategy:
      matrix: ${{ fromJson(needs.select-targets.outputs.matrix) }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      # Windows 上 shell: bash 会把 Git 的 GNU tar 放进 PATH；GNU tar 把
      # "D:..." 盘符路径当远程主机（Cannot connect to D: resolve failed）。
      # hutch 打包 updater tar.zst 与我们脚本里的 tar 调用都会踩中
      #（2026-09-09 desktop-alpha-v0.54.0-alpha.1 windows job 实测）。
      # GNU tar 读 TAR_OPTIONS；bsdtar（macOS）完全忽略该环境变量，无副作用。
      TAR_OPTIONS: --force-local
    steps:
      - uses: actions/checkout@v4
        with:
          # 构建内容 = select-targets 校验过的同一 projection_sha（不变式：
          # metadata validation / build / R2 / GitHub release 全部基于同一 SHA）。
          ref: ${{ inputs.projection_sha }}
          clean: true
      - name: Setup reusable Windows desktop workspace
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-desktop
      - name: Setup Bun
        if: runner.os != 'Windows'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libgtk-3-dev libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev librsvg2-dev
      - name: Verify Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: bash ./scripts/ci/verifyLinuxDesktopDeps.sh
      - name: Install dependencies
        if: runner.os != 'Windows'
        run: bun install --frozen-lockfile

      - name: Build Windows desktop installer artifacts
        if: runner.os == 'Windows' && needs.select-targets.outputs.channel == 'stable'
        env:
          # 必须是**可达**的发布基座。此前指向 github.com/nolotus/nolo/releases/latest/download，
          # 而该仓只有 Pre-release（desktop-alpha-*），GitHub 的 releases/latest 排除
          # prerelease ⇒ 该 URL 恒 404（2026-09-14 实测）。这个值还会被
          # electrobun.config 的 release.baseUrl 烘焙进产物，所以 404 同时污染构建与产物。
          ELECTROBUN_RELEASE_BASE_URL: https://nolo.chat/public/downloads
          # 刻意**不设** NOLO_DESKTOP_SKIP_PATCH：它会让 electrobun 在 Windows 上
          # 跳过 delta patch 阶段，而实测该阶段被跳过时稳定版 payload 会缺运行时
          # 三件套且**不产出 NoloDesktop.tar**（recovery 因此只能退到残缺 payload）。
          # macOS/Linux 的稳定版构建从不设这个变量且一直正常，这里对齐它们。
        run: bun run --cwd packages/desktop build:stable:windows-installer

      - name: Smoke installed Windows desktop artifact
        if: runner.os == 'Windows' && needs.select-targets.outputs.channel == 'stable'
        timeout-minutes: 12
        env:
          NOLO_DESKTOP_SMOKE_MODE: release
          NOLO_DESKTOP_SMOKE_SETUP: packages/desktop/smoke-artifacts/NoloDesktop-Smoke-Setup.exe
          NOLO_DESKTOP_SMOKE_LAUNCHER: Nolo Desktop Smoke.vbs
          # Windows 证据只能来自真实安装：Inno Setup 安装器无法在 Linux release
          # runner 上解包。smoke 安装后扫描安装目录并绑定真实发布的安装器 bytes。
          NOLO_DESKTOP_CAPABILITY_EVIDENCE_DIR: packages/desktop/artifacts
        run: |
          ./scripts/public-audit/desktop/smokeInstalledWindowsDesktop.ps1

      - name: Build desktop (${{ matrix.label }})
        if: runner.os != 'Windows' || needs.select-targets.outputs.channel != 'stable'
        # alpha 渠道下 Windows 也会进此 step（channel != 'stable'），run 脚本是
        # bash 语法，必须显式 shell: bash——Windows 默认 pwsh 会 ParserError
        #（2026-09-09 desktop-alpha-v0.54.0-alpha.1 首次 windows 构建实测踩中）。
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          NOLO_DESKTOP_BUILD_RPM: "1"
          NOLO_DESKTOP_BUILD_DEB: "1"
          # 同上：按渠道选可达基座，绝不使用恒 404 的 releases/latest。
          ELECTROBUN_RELEASE_BASE_URL: ${{ needs.select-targets.outputs.channel == 'stable' && 'https://nolo.chat/public/downloads' || 'https://us.nolo.chat/public/downloads' }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ needs.select-targets.outputs.channel }}" = "stable" ]; then
            bun run --cwd packages/desktop build:stable
          else
            bun run --cwd packages/desktop build:alpha
          fi

      - name: Record installed Windows desktop capability evidence (alpha)
        # alpha 的 Windows 也产出 Inno Setup 安装器，但只能在 Windows 上真实安装后
        # 才能取到最终 public tree；在构建完成后立刻安装并扫描，fail closed。
        if: runner.os == 'Windows' && needs.select-targets.outputs.channel != 'stable'
        timeout-minutes: 12
        env:
          NOLO_DESKTOP_SMOKE_MODE: release
          NOLO_DESKTOP_SMOKE_LAUNCHER: Nolo Desktop.vbs
          NOLO_DESKTOP_CAPABILITY_EVIDENCE_DIR: packages/desktop/artifacts
        run: |
          ./scripts/public-audit/desktop/smokeInstalledWindowsDesktop.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: packages/desktop/artifacts
          retention-days: 30

  release:
    needs: [select-targets, build]
    # build-only：只构建与校验证据，绝不发布。整条发布链（R2 上传、legacy 别名、
    # GitHub Release、manifest）都不参与，因此 build-only 的绿色含义是
    # 「目标平台的构建与证据成立」，而不是任何渠道状态变化。
    if: inputs.mode != 'build-only'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 发布侧工具链与构建内容同源：绑定同一 projection_sha。
          ref: ${{ inputs.projection_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install

      - name: Merge artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages/desktop/artifacts

      - name: Verify desktop capability evidence (fail closed, all platforms)
        run: |
          bun ./scripts/public-audit/desktop/verifyDesktopPackageCapability.ts release \
            --artifacts-dir packages/desktop/artifacts

      - name: Publish to R2 (CF CDN for China users)
        env:
          DESKTOP_DOWNLOAD_S3_ENDPOINT: ${{ secrets.DESKTOP_DOWNLOAD_S3_ENDPOINT }}
          DESKTOP_DOWNLOAD_S3_BUCKET: ${{ secrets.DESKTOP_DOWNLOAD_S3_BUCKET }}
          DESKTOP_DOWNLOAD_S3_REGION: ${{ secrets.DESKTOP_DOWNLOAD_S3_REGION }}
          DESKTOP_DOWNLOAD_S3_ACCESS_KEY_ID: ${{ secrets.DESKTOP_DOWNLOAD_S3_ACCESS_KEY_ID }}
          DESKTOP_DOWNLOAD_S3_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_DOWNLOAD_S3_SECRET_ACCESS_KEY }}
          DESKTOP_DOWNLOAD_PUBLIC_BASE: ${{ secrets.DESKTOP_DOWNLOAD_PUBLIC_BASE }}
          NOLO_DESKTOP_REQUIRE_LINUX_PACKAGES: "1"
          MIN_WIN_INSTALLER_BYTES: "47000000"
        run: |
          bun ./scripts/release/publishDesktopDownloads.ts \
            --channel "${{ needs.select-targets.outputs.channel }}" \
            --build-sha "${{ inputs.projection_sha }}"

      - name: Verify legacy alias URLs
        run: |
          if [ "${{ needs.select-targets.outputs.channel }}" = "stable" ]; then
            bun ./scripts/public-audit/desktop/verifyLegacyDesktopDownloadAlias.ts \
              https://nolo.chat/public/downloads \
              packages/desktop/artifacts stable
          else
            bun ./scripts/public-audit/desktop/verifyLegacyDesktopDownloadAlias.ts \
              https://us.nolo.chat/public/downloads \
              packages/desktop/artifacts alpha
          fi

      - name: Create GitHub Release (backup for overseas users)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.select-targets.outputs.tag }}
          CHANNEL: ${{ needs.select-targets.outputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # capability evidence JSON / snapshot 不进 GitHub Release（只发布安装包 + 更新元数据）。
          # 注意：这里刻意避开 -exec 加反斜杠分号的写法——在 TS 模板字面量里该转义会被
          # 求值成裸分号，提前终止 find，导致 release-assets 恒为空、通配无匹配，
          # 从而每次发布必然失败（2026-09-14 独立审查发现的确定性 CI 回归）。
          # 改用 -exec + 形式，无需终止符转义。
          for platform in linux windows macos; do
            platform_dir="packages/desktop/artifacts/desktop-$platform"
            if [ ! -d "$platform_dir" ]; then
              echo "::error::missing artifact directory for platform $platform ($platform_dir)" >&2
              exit 1
            fi
            find "$platform_dir" -maxdepth 1 -type f ! -name 'desktop-capability-evidence.json' -exec cp -t release-assets {} +
          done
          # 空产物必须响亮失败：否则 release-assets 通配无匹配会把字面量路径交给 gh。
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::no release assets were collected; refusing to create an empty GitHub Release" >&2
            exit 1
          fi
          RELEASE_NOTES="Desktop ${CHANNEL} build from ${{ inputs.projection_sha }}"
          FLAGS=(--notes "$RELEASE_NOTES")
          if [ "$CHANNEL" = "alpha" ]; then
            FLAGS+=(--prerelease)
          fi
          # 不可变 release 契约（no delete/recreate）：目标 tag 的 Release 已存在
          # 即 fail closed——包括 same version/different SHA 的重发企图。release
          # 存在性是唯一事实（无服务、无状态文件）；repair/retry 只能绑定 metadata
          # 声明的同一 version 重跑（release 尚未创建时），要换产物必须回 bun-nolo
          # bump 版本生成新 tag。
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists — refusing to delete/recreate (immutable release contract); same-version republish is not allowed" >&2
            exit 1
          fi
          gh release create "$TAG" release-assets/* \
            --title "Desktop ${CHANNEL} $(date -u +%Y-%m-%d)" \
            "${FLAGS[@]}"

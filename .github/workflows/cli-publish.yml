name: Publish CLI to npm

on:
  workflow_dispatch:
    inputs:
      binary_action:
        description: "none = npm only; validate = binary build only; publish = binary repair; release = npm then binary"
        required: true
        type: choice
        default: validate
        options:
          - none
          - validate
          - publish
          - release
      dist_tag:
        description: npm dist-tag
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - latest
      version:
        description: "Target CLI version (must equal projection-release-metadata.json at projection_sha)"
        required: true
        type: string
      projection_sha:
        description: "Exact public projection commit SHA (40-hex) to publish from"
        required: true
        type: string

concurrency:
  group: cli-npm-publish-${{ inputs.dist_tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.binary_action == 'none' || inputs.binary_action == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate dispatch binding (fail closed)
        run: |
          set -euo pipefail
          # repair/rebuild 与自动发布同契约：必须显式绑定 40-hex 投影 SHA 与
          # metadata 声明的目标版本；缺失或非法格式直接硬失败。
          if ! printf '%s' "${{ inputs.projection_sha }}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::projection_sha must be an exact 40-hex commit SHA, got '${{ inputs.projection_sha }}'" >&2
            exit 2
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.projection_sha }}
          clean: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - id: metadata
        name: Validate projection release metadata (fail closed)
        run: |
          set -euo pipefail
          # metadata 校验与 npm publish 基于同一 projection_sha；channel/version
          # 只来自 projection-release-metadata.json，绝不从 branch 推断。
          bun ./scripts/release/assertProjectionReleaseMetadata.ts \
            --component cli \
            --expect-intent release \
            --expect-version "${{ inputs.version }}" \
            --set-outputs channel,version,tag
      - name: Verify dist-tag matches metadata channel
        run: |
          set -euo pipefail
          # npm dist-tag 必须与 metadata channel 一致（alpha→alpha，stable→latest）。
          # 必须独立成步：同一步内引用本步 outputs 的表达式在步骤开始前求值，
          # 恒为空串（2026-09-13 发布失败实证），step outputs 只对后续步骤可见。
          case "${{ steps.metadata.outputs.channel }}:${{ inputs.dist_tag }}" in
            alpha:alpha|stable:latest) ;;
            *)
              echo "::error::dist_tag '${{ inputs.dist_tag }}' does not match metadata channel '${{ steps.metadata.outputs.channel }}' (alpha→alpha, stable→latest)" >&2
              exit 2
              ;;
          esac
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Publish nolo-cli to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NOLO_CLI_PUBLISH_DIST_TAG: ${{ inputs.dist_tag }}
          NOLO_CLI_PUBLISH_NPM_PREFIX: ${{ runner.temp }}/nolo-cli-prefix
        run: bash ./scripts/ci/runCliPublishPublic.sh

  binary:
    needs: publish
    if: ${{ always() && ((inputs.binary_action == 'validate' || inputs.binary_action == 'publish') && needs.publish.result == 'skipped' || inputs.binary_action == 'release' && needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate projection SHA
        env:
          PROJECTION_SHA: ${{ inputs.projection_sha }}
        run: |
          set -euo pipefail
          [[ "$PROJECTION_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.projection_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - id: metadata
        name: Validate release metadata and version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bun scripts/release/assertProjectionReleaseMetadata.ts --component cli --expect-intent release --expect-version "$VERSION" --set-outputs channel,version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Stage CLI downloads
        run: bun scripts/release/stageCliDownloads.ts
      - name: Smoke test Linux tarball
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          SMOKE_DIR="$RUNNER_TEMP/cli-smoke"
          mkdir -p "$SMOKE_DIR/home"
          tar -xzf public/downloads/nolo-linux-x64.tar.gz -C "$SMOKE_DIR"
          export HOME="$SMOKE_DIR/home"
          ACTUAL_VERSION="$("$SMOKE_DIR/nolo" --version)"
          [[ "$ACTUAL_VERSION" == "$VERSION" || "$ACTUAL_VERSION" == "nolo $VERSION" || "$ACTUAL_VERSION" == "nolo-cli-linux-x64 $VERSION" ]]
          "$SMOKE_DIR/nolo" --help > "$SMOKE_DIR/help.txt"
          grep -qi nolo "$SMOKE_DIR/help.txt"
      - name: Publish CLI binary tarballs
        if: ${{ inputs.binary_action == 'publish' || inputs.binary_action == 'release' }}
        env:
          DESKTOP_DOWNLOAD_S3_ENDPOINT: ${{ secrets.DESKTOP_DOWNLOAD_S3_ENDPOINT }}
          DESKTOP_DOWNLOAD_S3_BUCKET: ${{ secrets.DESKTOP_DOWNLOAD_S3_BUCKET }}
          DESKTOP_DOWNLOAD_S3_REGION: ${{ secrets.DESKTOP_DOWNLOAD_S3_REGION }}
          DESKTOP_DOWNLOAD_S3_ACCESS_KEY_ID: ${{ secrets.DESKTOP_DOWNLOAD_S3_ACCESS_KEY_ID }}
          DESKTOP_DOWNLOAD_S3_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_DOWNLOAD_S3_SECRET_ACCESS_KEY }}
          DESKTOP_DOWNLOAD_PUBLIC_BASE: ${{ secrets.DESKTOP_DOWNLOAD_PUBLIC_BASE }}
          DESKTOP_DOWNLOAD_S3_PREFIX: ${{ secrets.DESKTOP_DOWNLOAD_S3_PREFIX }}
          NOLO_CLI_BINARY_CHANNEL: ${{ steps.metadata.outputs.channel == 'stable' && 'main' || steps.metadata.outputs.channel }}
        run: bun scripts/release/publishCliBinary.ts

  npm-install-health:
    name: npm install health (${{ matrix.os }} / Node ${{ matrix.node }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 26
    steps:
      - uses: actions/checkout@v5
        with:
          # 健康检查读的 packages/cli/package.json 版本必须就是本次发布的版本：
          # 绑定同一 projection_sha，不读可能已前移的默认分支。
          ref: ${{ inputs.projection_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install published nolo-cli from npm
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          npm install -g "nolo-cli@${VERSION}"
          nolo --version
          nolo doctor

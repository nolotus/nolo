name: Publish CLI to npm

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - latest
      version:
        description: "Target CLI version (must equal projection-release-metadata.json at projection_sha)"
        required: true
        type: string
      projection_sha:
        description: "Exact public projection commit SHA (40-hex) to publish from"
        required: true
        type: string

concurrency:
  group: cli-npm-publish-${{ inputs.dist_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate dispatch binding (fail closed)
        run: |
          set -euo pipefail
          # repair/rebuild 与自动发布同契约：必须显式绑定 40-hex 投影 SHA 与
          # metadata 声明的目标版本；缺失或非法格式直接硬失败。
          if ! printf '%s' "${{ inputs.projection_sha }}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::projection_sha must be an exact 40-hex commit SHA, got '${{ inputs.projection_sha }}'" >&2
            exit 2
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.projection_sha }}
          clean: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - id: metadata
        name: Validate projection release metadata (fail closed)
        run: |
          set -euo pipefail
          # metadata 校验与 npm publish 基于同一 projection_sha；channel/version
          # 只来自 projection-release-metadata.json，绝不从 branch 推断。
          bun ./scripts/release/assertProjectionReleaseMetadata.ts \
            --component cli \
            --expect-intent release \
            --expect-version "${{ inputs.version }}" \
            --set-outputs channel,version,tag
      - name: Verify dist-tag matches metadata channel
        run: |
          set -euo pipefail
          # npm dist-tag 必须与 metadata channel 一致（alpha→alpha，stable→latest）。
          # 必须独立成步：同一步内引用本步 outputs 的表达式在步骤开始前求值，
          # 恒为空串（2026-09-13 发布失败实证），step outputs 只对后续步骤可见。
          case "${{ steps.metadata.outputs.channel }}:${{ inputs.dist_tag }}" in
            alpha:alpha|stable:latest) ;;
            *)
              echo "::error::dist_tag '${{ inputs.dist_tag }}' does not match metadata channel '${{ steps.metadata.outputs.channel }}' (alpha→alpha, stable→latest)" >&2
              exit 2
              ;;
          esac
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Publish nolo-cli to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NOLO_CLI_PUBLISH_DIST_TAG: ${{ inputs.dist_tag }}
          # 发布版本必须显式注入：main 不再为版本号产生提交之后，投影里的
          # packages/cli/package.json 会停在 alpha 版本线上，真正的发布版本只在
          # tag / projection-release-metadata.json 里。不传这一项，脚本会按旧版本
          # 判定「该版本已存在、本次无新版本」而静默跳过 npm publish。
          NOLO_CLI_PUBLISH_VERSION: ${{ steps.metadata.outputs.version }}
          NOLO_CLI_PUBLISH_NPM_PREFIX: ${{ runner.temp }}/nolo-cli-prefix
        run: bash ./scripts/ci/runCliPublishPublic.sh

  npm-install-health:
    name: npm install health (${{ matrix.os }} / Node ${{ matrix.node }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 26
    steps:
      - uses: actions/checkout@v4
        with:
          # 健康检查必须绑定同一 projection_sha（不读可能已前移的默认分支）；
          # 版本本身来自 inputs.version / metadata，不来自投影里的 package.json。
          ref: ${{ inputs.projection_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install published nolo-cli from npm
        shell: bash
        run: |
          set -euo pipefail
          # 用本次发布的声明版本，而不是读投影里的 package.json：main 不再为版本号
          # 产生提交后，那个文件会停在 alpha 版本线上，健康检查会去装一个旧版本
          # 并「通过」——查错了对象比失败更糟。
          VERSION="${{ inputs.version }}"
          npm install -g "nolo-cli@${VERSION}"
          nolo --version
          nolo doctor

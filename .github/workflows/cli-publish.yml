name: Publish CLI to npm

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - latest

concurrency:
  group: cli-publish-${{ inputs.dist_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify snapshot carries Source-Commit trailer
        run: |
          set -euo pipefail
          if ! git log -1 --format=%B | grep -q '^Source-Commit:'; then
            echo "::error::Snapshot HEAD commit is missing 'Source-Commit:' trailer; refusing to publish."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Publish nolo-cli to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NOLO_CLI_PUBLISH_DIST_TAG: ${{ inputs.dist_tag }}
          NOLO_CLI_PUBLISH_NPM_PREFIX: ${{ runner.temp }}/nolo-cli-prefix
        run: bash ./scripts/ci/runCliPublishCi.sh
